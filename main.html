<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
 <h3>Job Application Form</h3>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name" required>
        <br>    
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email" required>
        <br>
        <input type="radio" id="gender-m" name="gender" value="male" required>
        <label for="gender-m">Male</label>  
        <input type="radio" id="gender-f" name="gender" value="female" required>
        <label for="gender-f">Female</label>
        <br>
        <label for="laptop">Laptop Brands:</label>
        <select id="laptop">
            <option id="apple">Apple</option>
            <option id="asus">Asus</option>
            <option id="HP">HP</option>

        </select>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" required">
        <br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="password" required>
        <br>
        <label for="portfolio">Portfolio URL:</label>
        <input type="url" id="portfolio" required>
        <br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
